name: Build AAR

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build AAR
      run: ./gradlew assembleRelease

    - name: List built files
      run: |
        echo "=== Looking for AAR files ==="
        find . -name "*.aar" -type f
        echo "=== Directory structure ==="
        ls -la */build/outputs/aar/ 2>/dev/null || echo "No AARs found yet"
        
    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: library-release-aar
        path: |
          auth-legacy/build/outputs/aar/auth-legacy-release.aar
          auth/build/outputs/aar/auth-release.aar
          core/build/outputs/aar/core-release.aar
